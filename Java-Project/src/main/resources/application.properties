spring.application.name =Aluno Online

spring.datasource.url=jdbc:postgresql://localhost:5432/aluno_online
spring.datasource.username=postgres
spring.datasource.password=jasm
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Quem cria/altera as tabelas agora é o Flyway. O Hibernate só confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway: roda os scripts de src/main/resources/db/migration ao subir a aplicação.
# baseline-on-migrate: se o banco já tiver as tabelas (criadas antes pelo ddl-auto=update),
# o Flyway marca a V1 como já aplicada em vez de dar erro.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Usuários da API (HTTP Basic). Troque as senhas pelas variáveis de ambiente fora do ambiente de aula.
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.user.username=${USER_USERNAME:usuario}
app.security.user.password=${USER_PASSWORD:usuario123}

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
