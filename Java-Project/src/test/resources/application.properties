# Testes rodam com H2 em memória (modo PostgreSQL), sem precisar do banco real.
spring.datasource.url=jdbc:h2:mem:aluno_online;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.security.admin.username=admin
app.security.admin.password=admin123
app.security.user.username=usuario
app.security.user.password=usuario123
